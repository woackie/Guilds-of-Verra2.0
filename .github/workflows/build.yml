name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Remove untrusted wrapper jar from runner
        run: rm -f gradle/wrapper/gradle-wrapper.jar

      - name: Set up official Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'

      - name: Validate design data
        run: python3 scripts/validate_project.py

      - name: Build mod
        run: gradle build --stacktrace

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: guilds-of-verra-build
          path: build/libs/*.jar
          if-no-files-found: error
